name: Build Mainline Linux for Xiaomi Mi A2

on:
  workflow_dispatch:
    inputs:
      ui_choice:
        description: 'Giao diện (console = nhẹ nhất, phosh = cảm ứng)'
        required: true
        default: 'console'
        type: choice
        options:
          - console
          - phosh
          - sxmo-de-sway

jobs:
  build-pmos:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Dọn dẹp dung lượng trống
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: 2. Cài đặt công cụ phụ thuộc
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git openssl multipath-tools qemu-user-binfmt binfmt-support

      - name: 3. Cài đặt pmbootstrap và tải pmaports
        run: |
          git clone --depth 1 https://github.com ~/pmbootstrap
          sudo ln -s ~/pmbootstrap/pmbootstrap.py /usr/local/bin/pmbootstrap

          mkdir -p ~/.local/var/pmbootstrap/cache_git
          git clone --depth 1 https://github.com ~/.local/var/pmbootstrap/cache_git/pmaports


      - name: 4. Kéo mã nguồn Xiaomi Mi A2 (sdm660-mainline)
        run: |
          PMAPORTS_DIR=~/.local/var/pmbootstrap/cache_git/pmaports
          
          # Kiểm tra xem jasmine_sprout đã có trong repo chính thức chưa
          FOUND=$(find "$PMAPORTS_DIR/device" -maxdepth 2 -name "device-xiaomi-jasmine_sprout" | head -n 1)
          
          if [ -z "$FOUND" ]; then
            echo "Chưa có trong repo chính, đang kéo từ sdm660-mainline..."
            git clone --depth 1 https://github.com ~/sdm660-pmaports
            cp -rn ~/sdm660-pmaports/device/testing/* "$PMAPORTS_DIR/device/testing/" 2>/dev/null || true
            cp -rn ~/sdm660-pmaports/device/community/* "$PMAPORTS_DIR/device/community/" 2>/dev/null || true
          fi
          
          # Xác nhận lại thư mục thiết bị đã tồn tại
          find "$PMAPORTS_DIR/device" -maxdepth 2 -name "*jasmine_sprout*"

      - name: 5. Cấu hình pmbootstrap
        run: |
          pmbootstrap config work ~/.local/var/pmbootstrap
          pmbootstrap config aports ~/.local/var/pmbootstrap/cache_git/pmaports
          pmbootstrap config device xiaomi-jasmine_sprout
          pmbootstrap config ui ${{ github.event.inputs.ui_choice }}
          pmbootstrap config user user
          pmbootstrap status

      - name: 6. Biên dịch nhân và đóng gói hệ điều hành
        run: |
          pmbootstrap install --password 147147

      - name: 7. Xuất file ảnh
        run: |
          pmbootstrap export
          mkdir -p ~/release_files
          cp -L /tmp/postmarketOS-export/* ~/release_files/
          ls -lh ~/release_files/

      - name: 8. Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaomi-mia2-mainline-${{ github.event.inputs.ui_choice }}
          path: ~/release_files/*
          retention-days: 7
